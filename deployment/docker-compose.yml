version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: uniml-backend
    ports:
      - "8000:8000"
    environment:
      - UNIML_DEBUG=false
      - UNIML_LOG_LEVEL=INFO
    volumes:
      - ../uploads:/app/uploads
      - ../generated:/app/generated
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
