[metadata]
name = uniml
version = 1.0.0
description = Universal ML Deployment Platform
long_description = file: README.md
long_description_content_type = text/markdown
author = UniML Contributors
license = MIT
python_requires = >=3.11

[options]
packages = find:

[tool:pytest]
testpaths = tests
asyncio_mode = auto

[flake8]
max-line-length = 120
exclude = venv, __pycache__, build, dist
